    <script>

        $(function() {
            $.ajax({
                type: "GET",
                url : "p20221206-select-data.php",
                dataType: "json",
                success: showdata,
                error: function() {
                    console.log("讀取後端資料失敗");
                },
            })
        })

        function showdata(data) {
            var obj;
            var htmlStr1,htmlStr2,htmlStr3;
            // var table_style = ['table-primary','table-success','table-light','table-secondary','table-warning','table-danger','table-dark'];   //length=8
            var table_style = ['table-primary','table-success','table-light','table-secondary','table-warning','table-danger'];   //length=7, 不要dark, 黑魯魯的很難看

            for (var i = 0; i < data.length; i++) {
                obj = data[i];
                // console.log(obj);
                // htmlStr1 = '<tr>';
                htmlStr1 = '<tr class="'+table_style[i%7]+'">';
                // htmlStr2 = '<td>'+obj.ID+'<td>'+obj.Username+'<td>'+obj.Password+'<td>'+obj.Nickname+'<td>'+obj.Height+'<td>'+obj.Weight+'<td>'+obj.Created_at;
                htmlStr2 = '<td>'+obj.ID+'<td>'+obj.Username+'<td>'+obj.Nickname+'<td>'+obj.Height+'<td>'+obj.Weight+'<td>'+obj.Created_at;
                htmlStr3 = '</tr>';
                $("#showmsg").append(htmlStr1+htmlStr2+htmlStr3);
            }
        }
    </script>
</head>

        const table_style = ['table-primary', 'table-success', 'table-light', 'table-secondary', 'table-warning', 'table-danger']; // length = 6

        /**
         * 根據 userData 產生表格的 HTML 列 (rows)。
         */
        function generateTableRows() {
            // 1. 使用 map 迭代陣列，並為每個用戶產生一個 HTML <tr> 字串
            const allHtmlRows = userData.map((user, index) => {
                // 使用取餘數操作符 (%) 確保索引在 table_style 陣列長度內
                const rowClass = table_style[index % table_style.length];

                // 使用模板字串 (Template Literals) 讓 HTML 結構更清晰
                return `
                    <tr class="${rowClass}">
                        <td>${user.ID}</td>
                        <td>${user.Username}</td>
                        <td>${user.Nickname}</td>
                        <td>${user.Height} cm</td>
                        <td>${user.Weight} kg</td>
                        <td>${user.Created_at}</td>
                    </tr>
                `;
            }).join(''); // 2. 使用 join('') 將字串陣列合併為一個單一的 HTML 字串

            // 3. 執行 DOM 插入操作，提高效率
            $("#showmsg").append(allHtmlRows);
        }

        // 建議在文件載入完成後執行此函式
        $(document).ready(function() {
            generateTableRows();
        });
    </script>
