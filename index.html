    <script>
        // 獲取一個新的日期物件 (包含當前日期和時間)
        const now = new Date();
        
        // 將日期物件轉換為易讀的字串（例如：Wed Nov 26 2025 01:21:19 GMT-0600 (Central Standard Time)）
        // 您也可以使用 toLocaleDateString() 或 toLocaleString() 來取得更本地化的格式
        const dateString = now.toLocaleString('zh-TW', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            // hour: '2-digit', 
            // minute: '2-digit', 
            // second: '2-digit' 
        });

        // 找到 id 為 "current-date" 的 HTML 元素
        const dateElement = document.getElementById('current-date');
        
        // 將日期字串放入該元素的內容中
        dateElement.textContent = dateString;
    </script>
